<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Login Page</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="page-shell">
    <section class="login-card" aria-labelledby="page-title">
      <a class="brand" href="/" aria-label="Login Page home">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span>Login Page</span>
      </a>

      <div class="intro">
        <p class="eyebrow">JOIN LOGIN PAGE</p>
        <h1 id="page-title">Create your account</h1>
        
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="notice {{ category }}" role="status">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('signup') }}">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Your full name" autocomplete="name" required>

        <label class="field-label" for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

        <label class="field-label" for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
          <button class="show-password" type="button" data-target="password" aria-controls="password" aria-pressed="false">Show</button>
        </div>

        <label class="field-label" for="confirm_password">Confirm password</label>
        <div class="password-wrap">
          <input id="confirm_password" name="confirm_password" type="password" placeholder="Enter your password again" autocomplete="new-password" minlength="8" required>
          <button class="show-password" type="button" data-target="confirm_password" aria-controls="confirm_password" aria-pressed="false">Show</button>
        </div>

        <button class="submit-button signup-submit" type="submit">Create account <span aria-hidden="true">→</span></button>
      </form>

      <p class="signup-prompt">Already have an account? <a class="text-link" href="{{ url_for('login') }}">Sign in</a></p>
      <p class="footer-note">Wholesome choices, made simple.</p>
    </section>
  </main>
  <script>
    document.querySelectorAll('.show-password').forEach((button) => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.target);
        const showing = input.type === 'password';
        input.type = showing ? 'text' : 'password';
        button.textContent = showing ? 'Hide' : 'Show';
        button.setAttribute('aria-pressed', String(showing));
      });
    });
  </script>
</body>
</html>
